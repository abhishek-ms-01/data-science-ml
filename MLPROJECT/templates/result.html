<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Value Prediction Result</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: white;

            padding: 40px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        .label {
            color: #777;
            font-size: 16px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;

            color: #667eea;

            margin: 20px 0;
        }

        .back-btn {
            display: inline-block;

            margin-top: 25px;

            padding: 12px 25px;

            background: #667eea;
            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
        }

        .back-btn:hover {
            background: #5568d9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🏠 House Value Prediction</h1>

        <p class="label">
            Predicted House Price
        </p>

        <div class="price">
            ${{ prediction }}
        </div>

        <a href="/" class="back-btn">
            Predict Another House
        </a>

    </div>

</body>

</html>
